<header th:fragment="header(title)" class="header" xmlns:th="http://www.w3.org/1999/xhtml">
    <div class="d-flex flex-column gap-3 align-items-center mt-3">

        <h1 th:text="${title}" class="fs-6 fw-normal text-center"></h1>

        <div class="d-flex justify-content-between gap-5 bg-body-tertiary p-3 w-50 align-items-center" style="width: 55% !important;" >

            <a th:href="@{/}" class="link-reset d-flex align-items-center gap-2">
                <img class="image-thumbnail" width="32" height="32"
                     th:src="@{/images/pizza-logo.png}" alt="Logo"/>
                <span class="fw-medium">MyPizza4Ever</span>
            </a>

            <div class="d-flex align-items-center gap-2">

                <span th:if="${currentUser != null && balance != null}"
                      class="badge bg-warning text-dark d-flex align-items-center px-3 py-2">

                    <form th:action="@{/payment/deposit}" method="post" class="d-flex align-items-center gap-1">

                        <input type="hidden" name="_method" value="patch"/>

                        <input type="number" name="amount" step="0.01" min="0.01" placeholder="Einzahlung"
                               class="form-control form-control-sm" style="width: 110px" required/>

                        <button type="submit" class="btn btn-sm btn-success" title="Deposit" style="margin-right: 8px">+</button>
                    </form>

                    <span class="fw-semibold" th:text="${#numbers.formatDecimal(balance,1,2)}"></span> €
                </span>


                <a th:if="${currentUser != null && currentUser.role.name() != 'ADMIN'}"
                   th:href="@{/ordered}" class="btn btn-outline-info">
                    meine bestellungen
                </a>

                <a th:if="${currentUser != null && currentUser.role.name() != 'ADMIN'}"
                   th:href="@{/profile}" class="btn btn-outline-primary">
                    profil
                </a>

                <form th:if="${currentUser != null}" th:action="@{/logout}" method="post" style="display:inline;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="btn btn-outline-success">ausloggen</button>
                </form>

                <a th:if="${currentUser == null}" th:href="@{/login}" class="btn btn-outline-success">
                    einloggen
                </a>
            </div>
        </div>
    </div>

    <div class="modal fade" id="depositModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-sm modal-dialog-centered">
            <div class="modal-content">
                <form id="depositForm">
                    <div class="modal-header">
                        <h5 class="modal-title">Deposit</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>

                    <div class="modal-body">
                        <label for="amount" class="form-label">Amount</label>
                        <input type="number"
                               step="0.01"
                               min="0.01"
                               class="form-control"
                               id="amount"
                               required>
                    </div>

                    <div class="modal-footer">
                        <button type="button"
                                class="btn btn-secondary"
                                data-bs-dismiss="modal">
                            Cancel
                        </button>
                        <button type="submit" class="btn btn-success">
                            Deposit
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</header>
