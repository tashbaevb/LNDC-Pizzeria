<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/general :: general('Pizza Edit')}"></head>
<body>

<header th:replace="~{fragments/header :: header('Pizza Änderung')}"></header>

<main class="d-flex flex-column align-items-center gap-2">
    <section class="pizza-edit w-50 mt-4 d-flex flex-column gap-2">
        <h1 class="fs-4 fw-normal text-center">Edit Pizza</h1>
        <form th:action="@{'/pizzas/update/' + ${pizza.id}}" th:object="${pizza}" method="post"
              class="d-flex flex-column gap-2">
            <div class="form-group">
                <label>Name:</label>
                <input class="form-control" type="text" th:field="*{name}"/>
            </div>

            <div class="form-group">
                <label>Small:</label>
                <input class="form-control" type="number" step="0.01" th:field="*{priceSmall}"/>
            </div>

            <div class="form-group">
                <label>Medium:</label>
                <input class="form-control" type="number" step="0.01" th:field="*{priceMedium}"/>
            </div>

            <div class="form-group">
                <label>Large:</label>
                <input class="form-control" type="number" step="0.01" th:field="*{priceLarge}"/>
            </div>
            <button class="btn btn-primary" type="submit">Ändern</button>
        </form>
        <a class="btn btn-outline-tertiary" th:href="@{/}">zurück zum Menu</a>
    </section>
</main>

<footer th:replace="~{fragments/footer}" class="footer"></footer>

</body>
</html>
